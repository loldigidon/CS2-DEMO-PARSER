name: Feature request
description: Suggest a parser, metric, export, or dashboard improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or analysis that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Demo/event evidence
      description: Mention relevant maps, events, tables, or edge cases without sharing private data.
